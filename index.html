<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d6452f">
<title>初台グルメマップ｜渋谷・新宿の食べログ上位1200店</title>
<meta name="description" content="初台・渋谷・新宿エリアの食べログ評価上位1200店をスマホで探せるグルメマップ。ジャンル・予算・評価・現在地から絞り込み。">

<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="vendor/MarkerCluster.Default.css">

<style>
  :root{
    --accent:#d6452f; --accent-d:#b5371f;
    --bg:#f6f6f4; --card:#fff; --ink:#222; --sub:#777; --line:#e7e7e3;
    --gold:#e8a200; --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);background:var(--bg);overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  #map{position:fixed;inset:0;z-index:1}
  /* 「この範囲」で実際に検索される領域を示す枠（ヘッダーと既定シート位置の間） */
  #rangeBox{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 54px);bottom:40vh;
    border:2px dashed rgba(214,69,47,.5);border-radius:14px;z-index:850;pointer-events:none;display:none}
  #rangeBox::after{content:'この範囲で検索中';position:absolute;top:-11px;left:12px;background:var(--accent);
    color:#fff;font-size:.62rem;font-weight:700;padding:1px 8px;border-radius:8px}
  #rangeBox.on{display:block}
  .leaflet-popup-content{margin:0;width:230px!important}
  .leaflet-popup-content-wrapper{border-radius:14px;overflow:hidden;padding:0}
  .leaflet-popup-content p{margin:0}

  /* ===== header ===== */
  header{
    position:fixed;top:0;left:0;right:0;z-index:1000;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;
    background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.82) 70%,rgba(255,255,255,0));
    pointer-events:none;
  }
  .bar{display:flex;gap:6px;align-items:center;pointer-events:auto}
  .logo{font-weight:800;font-size:.86rem;color:var(--accent);white-space:nowrap;letter-spacing:0;flex:none}
  .logo small{display:block;font-size:.56rem;color:var(--sub);font-weight:600}
  .search{
    flex:1;min-width:0;display:flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);
    border-radius:22px;padding:8px 10px;box-shadow:0 2px 10px rgba(0,0,0,.08);
  }
  .search input{border:none;outline:none;flex:1;font-size:.88rem;background:transparent;min-width:0}
  .search svg{flex:none;opacity:.5}
  .fbtn{
    flex:none;display:flex;align-items:center;gap:5px;background:var(--accent);color:#fff;border:none;
    border-radius:22px;padding:9px 12px;font-size:.8rem;font-weight:700;box-shadow:0 2px 10px rgba(214,69,47,.35);white-space:nowrap;
  }
  .fbtn .dot{background:#fff;color:var(--accent);border-radius:10px;font-size:.68rem;padding:0 5px;font-weight:800}

  /* ===== floating buttons ===== */
  .fab{
    position:fixed;right:12px;z-index:900;width:46px;height:46px;border-radius:50%;
    background:#fff;border:1px solid var(--line);box-shadow:0 3px 12px rgba(0,0,0,.15);
    display:flex;align-items:center;justify-content:center;
  }
  #locBtn{bottom:calc(40vh + 14px + var(--safe-b))}
  #locBtn.active{background:var(--accent);border-color:var(--accent)}
  #locBtn.active svg{stroke:#fff}
  #shareBtn{bottom:calc(40vh + 14px + 56px + var(--safe-b))}
  .toast{position:fixed;left:50%;bottom:calc(44vh + var(--safe-b));transform:translateX(-50%);
    background:rgba(0,0,0,.84);color:#fff;padding:10px 18px;border-radius:22px;font-size:.82rem;font-weight:600;
    z-index:3000;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}

  /* ===== bottom sheet ===== */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:950;
    height:40vh;background:var(--card);border-radius:18px 18px 0 0;
    box-shadow:0 -4px 24px rgba(0,0,0,.16);display:flex;flex-direction:column;
    transition:height .28s cubic-bezier(.4,0,.2,1);touch-action:none;
  }
  .sheet.expanded{height:88vh}
  .sheet.collapsed{height:96px}
  .grip{display:flex;justify-content:center;padding:8px 0 4px;cursor:grab}
  .grip span{width:40px;height:4px;border-radius:3px;background:#d4d4cf}
  .sheet-head{padding:2px 14px 8px;display:flex;align-items:center;gap:10px}
  .count{font-size:.92rem;font-weight:800}
  .count b{color:var(--accent)}
  .sort{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:.78rem;color:var(--sub);white-space:nowrap}
  @media (max-width:359px){.sortlbl{display:none}}
  .sort select{border:1px solid var(--line);border-radius:14px;padding:5px 8px;font-size:.78rem;background:#fff;color:var(--ink)}
  .areaToggle{font-size:.74rem;font-weight:700;padding:6px 10px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--sub);white-space:nowrap}
  .areaToggle.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px calc(20px + var(--safe-b))}

  .card{
    display:flex;gap:10px;padding:10px;border-radius:14px;background:#fff;border:1px solid var(--line);
    margin-bottom:9px;align-items:stretch;
  }
  .card:active{background:#fafaf8}
  .thumb{width:84px;height:84px;border-radius:10px;object-fit:cover;flex:none;background:#eee}
  .info{flex:1;min-width:0;display:flex;flex-direction:column}
  .nm{font-size:.92rem;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{font-size:.72rem;color:var(--sub);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px}
  .rate{display:inline-flex;align-items:center;gap:3px;font-weight:800;color:var(--gold)}
  .rate .star{color:var(--gold)}
  .badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:5px}
  .badge{font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:6px;background:#f0efe9;color:#6b6b63}
  .badge.award{background:#fff4d6;color:#a8730a}
  .badge.gen{background:#fbe9e5;color:var(--accent-d)}
  .empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:.85rem}

  /* ===== filter modal ===== */
  .modal{position:fixed;inset:0;z-index:2000;display:none}
  .modal.show{display:block}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.4)}
  .panel{
    position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;
    max-height:90vh;display:flex;flex-direction:column;animation:up .25s ease;
  }
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .panel-head{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
  .panel-head h2{font-size:1rem}
  .panel-head .x{margin-left:auto;font-size:1.5rem;color:var(--sub);background:none;border:none;line-height:1}
  .panel-body{overflow-y:auto;padding:14px 16px;flex:1}
  .fgroup{margin-bottom:18px}
  .fgroup>label{display:block;font-size:.82rem;font-weight:800;margin-bottom:9px}
  .fgroup .hint{font-size:.68rem;font-weight:600;color:var(--sub);margin-left:4px}
  .range2{display:flex;align-items:center;gap:8px}
  .range2 .tilde{color:var(--sub);font-weight:700}
  #dayChips .chip{min-width:38px;text-align:center;padding:7px 0}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    font-size:.8rem;padding:7px 12px;border-radius:18px;border:1px solid var(--line);
    background:#fff;color:var(--ink);font-weight:600;
  }
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  select.full{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;font-size:.9rem;background:#fff}
  .toggles{display:flex;flex-wrap:wrap;gap:7px}
  .panel-foot{display:flex;gap:10px;padding:12px 16px calc(14px + var(--safe-b));border-top:1px solid var(--line)}
  .panel-foot button{flex:1;padding:13px;border-radius:14px;font-size:.92rem;font-weight:800;border:none}
  .btn-reset{background:#f0efe9;color:#555}
  .btn-apply{background:var(--accent);color:#fff}

  /* popup card */
  .pop{font-family:inherit}
  .pop img{width:100%;height:120px;object-fit:cover;display:block;background:#eee}
  .pop .pad{padding:9px 11px 11px}
  .pop .pn{font-size:.92rem;font-weight:800;line-height:1.3}
  .pop .pm{font-size:.72rem;color:var(--sub);margin:4px 0 8px;display:flex;flex-wrap:wrap;gap:3px 8px}
  .pop .acts{display:flex;gap:6px}
  .pop .acts a{
    flex:1;text-align:center;font-size:.72rem;font-weight:700;text-decoration:none;
    padding:8px 4px;border-radius:9px;color:#fff;
  }
  .a-tel{background:#2e9e5b}.a-tbl{background:var(--accent)}.a-map{background:#3a78d6}
  .marker-pin{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);width:100%;height:100%}

  @media (min-width:640px){
    .sheet,.locBtn{max-width:420px}
    .sheet{left:auto;right:0;height:100vh!important;border-radius:0;width:400px}
    #map{right:400px}
    .sheet.collapsed,.sheet.expanded{height:100vh!important}
    #locBtn{bottom:24px;right:412px}
    #shareBtn{bottom:80px;right:412px}
    #rangeBox{display:none!important}   /* PCはシートが右パネルなので枠は不要 */
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="rangeBox" aria-hidden="true"></div>

<header>
  <div class="bar">
    <div class="logo">初台グルメ<small>食べログ上位1200店</small></div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="q" type="search" placeholder="店名・ジャンルで検索" enterkeyhint="search">
    </div>
    <button class="fbtn" id="openFilter">絞込<span class="dot" id="fcount" hidden>0</span></button>
  </div>
</header>

<button class="fab" id="shareBtn" aria-label="この条件を共有">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
</button>
<button class="fab" id="locBtn" aria-label="現在地">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
</button>
<div class="toast" id="toast"></div>

<section class="sheet" id="sheet">
  <div class="grip" id="grip"><span></span></div>
  <div class="sheet-head">
    <div class="count"><b id="num">0</b> 件</div>
    <button class="areaToggle on" id="areaToggle" aria-pressed="true">📍この範囲</button>
    <div class="sort"><span class="sortlbl">並び替え</span>
      <select id="sort">
        <option value="center">地図の中央から近い</option>
        <option value="rating">評価が高い</option>
        <option value="reviews">口コミが多い</option>
        <option value="saves">保存が多い</option>
        <option value="dist">現在地から近い</option>
      </select>
    </div>
  </div>
  <div class="list" id="list"></div>
</section>

<!-- filter modal -->
<div class="modal" id="filter">
  <div class="scrim" data-close></div>
  <div class="panel">
    <div class="panel-head"><h2>絞り込み</h2><button class="x" data-close>&times;</button></div>
    <div class="panel-body">
      <div class="fgroup">
        <label>ジャンル <span class="hint">複数選択できます</span></label>
        <div class="chips" id="genreChips"></div>
      </div>
      <div class="fgroup">
        <label>営業曜日 <span class="hint">その日に営業（定休日でない）店</span></label>
        <div class="chips" id="dayChips"></div>
      </div>
      <div class="fgroup">
        <label>最寄駅</label>
        <select class="full" id="stationSel"><option value="">すべての駅</option></select>
      </div>
      <div class="fgroup">
        <label>ディナー予算（ひとり）</label>
        <div class="range2">
          <select class="full" id="budgetMinSel"></select>
          <span class="tilde">〜</span>
          <select class="full" id="budgetMaxSel"></select>
        </div>
      </div>
      <div class="fgroup">
        <label>評価</label>
        <div class="chips" id="ratingChips"></div>
      </div>
      <div class="fgroup">
        <label>こだわり</label>
        <div class="toggles" id="toggleChips"></div>
      </div>
    </div>
    <div class="panel-foot">
      <button class="btn-reset" id="resetF">リセット</button>
      <button class="btn-apply" data-close>この条件で見る</button>
    </div>
  </div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<script>
const CENTER=[35.6816,139.6860], ZOOM=14;  // 初台周辺
let DATA=[], filtered=[], userLatLng=null, activeMarker=null;
const markerById=new Map();

// ---- genre buckets (128種を主要カテゴリへ集約) ----
const GENRE_BUCKETS=[
  ['ラーメン・つけ麺',/ラーメン|つけ麺|油そば|担々麺|まぜそば/],
  ['そば・うどん',/そば|蕎麦|うどん/],
  ['寿司・海鮮',/寿司|鮨|海鮮|魚|うなぎ|天ぷら|割烹|日本料理|懐石|和食/],
  ['焼肉・ホルモン',/焼肉|ホルモン|ステーキ|鉄板/],
  ['焼き鳥・串',/焼き鳥|焼鳥|串/],
  ['居酒屋・バー',/居酒屋|ダイニングバー|バー|ビアバー|立ち飲み|ワインバー|日本酒/],
  ['イタリアン・フレンチ',/イタリアン|フレンチ|ビストロ|スペイン|ピザ|パスタ|洋食/],
  ['中華',/中華|餃子|四川|台湾|点心/],
  ['アジア・エスニック',/タイ|ベトナム|韓国|インド|ネパール|エスニック|アジア/],
  ['カレー',/カレー/],
  ['カフェ・喫茶',/カフェ|喫茶|コーヒー|紅茶/],
  ['パン・スイーツ',/パン|ベーカリー|ケーキ|スイーツ|洋菓子|和菓子|アイス|チョコ|ドーナツ|タピオカ/],
  ['とんかつ・揚げ物',/とんかつ|から揚げ|串揚げ|串かつ|天丼/],
  ['定食・丼',/定食|食堂|丼|牛丼|お好み焼き|もんじゃ/],
];
function bucketOf(g){
  for(const [name,re] of GENRE_BUCKETS) if(re.test(g)) return name;
  return 'その他';
}
const BUCKET_NAMES=[...GENRE_BUCKETS.map(g=>g[0]),'その他'];  // URL共有でジャンルをindex化
// ディナー予算の選択肢（円）。下限/上限プルダウンで共用
const BUDGET_STEPS=[1000,2000,3000,4000,5000,6000,8000,10000,15000,20000,30000];
const RATINGS=[['すべて',0],['★4.0+',4.0],['★3.8+',3.8],['★3.6+',3.6]];
const TOGGLES=[['award','受賞店'],['privateRoom','個室あり'],['reservation','予約可'],['nosmoke','禁煙']];
const DAYNAMES=['月','火','水','木','金','土','日'];

// filter state（budgetMin/Max=選択した下限・上限。daysは営業日として要求する曜日index）
const F={genre:new Set(),days:new Set(),station:'',bmin:null,bmax:null,rating:0,toggles:new Set(),q:''};

// ---------- map ----------
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView(CENTER,ZOOM);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,attribution:'&copy; OpenStreetMap'
}).addTo(map);
const cluster=L.markerClusterGroup({
  maxClusterRadius:48,spiderfyOnMaxZoom:true,showCoverageOnHover:false,chunkedLoading:true
});
map.addLayer(cluster);

function pinColor(r){return r>=4.0?'#e8a200':r>=3.8?'#d6452f':'#3a78d6';}
function makeIcon(r){
  return L.divIcon({className:'',html:`<div class="marker-pin" style="background:${pinColor(r)}"></div>`,
    iconSize:[16,16],iconAnchor:[8,8],popupAnchor:[0,-8]});
}

const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function gmapsUrl(d){return `https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}`;}

function popupHtml(d){
  const tel=d.phone?`<a class="a-tel" href="tel:${esc(d.phone)}">電話</a>`:'';
  return `<div class="pop">
    <img loading="lazy" src="${esc(d.photo)}" alt="">
    <div class="pad">
      <div class="pn">${esc(d.name)}</div>
      <div class="pm">
        <span class="rate"><span class="star">★</span>${d.rating??'-'}</span>
        <span>${esc(d.genre)}</span>
        ${d.budgetNight?`<span>夜 ${esc(d.budgetNight)}</span>`:''}
        <span>${esc(d.station)}</span>
      </div>
      <div class="acts">
        ${tel}
        <a class="a-tbl" href="${esc(d.url)}" target="_blank" rel="noopener">食べログ</a>
        <a class="a-map" href="${gmapsUrl(d)}" target="_blank" rel="noopener">経路</a>
      </div>
    </div></div>`;
}

// ---------- list ----------
const listEl=document.getElementById('list');
const RENDER_STEP=40; let renderLimit=RENDER_STEP;

function haversine(a,b,c,d){
  const R=6371,toR=x=>x*Math.PI/180;
  const dLat=toR(c-a),dLng=toR(d-b);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function cardHtml(d){
  const badges=[];
  if(d.tabelogAward)badges.push('<span class="badge award">Tabelog Award</span>');
  if(d.hyakumeiten)badges.push('<span class="badge award">百名店</span>');
  badges.push(`<span class="badge gen">${esc(d.genreTop)}</span>`);
  if(d.privateRoom)badges.push('<span class="badge">個室</span>');
  const dist=userLatLng?` ・ ${haversine(userLatLng[0],userLatLng[1],d.lat,d.lng).toFixed(2)}km`:'';
  return `<div class="card" data-id="${d._id}">
    <img class="thumb" loading="lazy" src="${esc(d.photo)}" alt="">
    <div class="info">
      <div class="nm">${esc(d.name)}</div>
      <div class="meta">
        <span class="rate"><span class="star">★</span>${d.rating??'-'}</span>
        <span>口コミ${d.reviews}</span>
        <span>${esc(d.station)}${dist}</span>
        ${d.budgetNight?`<span>夜 ${esc(d.budgetNight)}</span>`:''}
      </div>
      <div class="badges">${badges.join('')}</div>
    </div></div>`;
}
let boundsOnly=true, view=[];   // 既定で「この範囲」ON
// 「この範囲」= 画面で実際に見えている地図部分（ヘッダーとボトムシートの間）。
// 縦画面では地図がフルスクリーンで縦長＆下部がシートに隠れるため、
// 見えている矩形だけに範囲を補正する。PCではシートが右の固定パネルなので地図全体でよい。
function visibleBounds(){
  if(window.innerWidth>=640) return map.getBounds();
  const size=map.getSize();
  const topPad=54;            // ヘッダーが被る上部
  const cutoff=size.y*0.60;   // 既定のシート位置(40vh)に合わせた下端。シート開閉では変えず安定させる
  const nw=map.containerPointToLatLng([0,topPad]);
  const se=map.containerPointToLatLng([size.x,cutoff]);
  return L.latLngBounds(nw,se);
}
function renderList(){
  const vb=boundsOnly?visibleBounds():null;
  view = boundsOnly ? filtered.filter(d=>vb.contains([d.lat,d.lng])) : filtered;
  document.getElementById('num').textContent=view.length;
  const slice=view.slice(0,renderLimit);
  listEl.innerHTML = view.length
    ? slice.map(cardHtml).join('') + (view.length>renderLimit?`<div class="empty">スクロールでさらに表示（${view.length-renderLimit}件）</div>`:'')
    : (boundsOnly
        ? '<div class="empty">この地図の範囲にお店がありません。<br>地図を動かすか「📍この範囲」を解除してください。</div>'
        : '<div class="empty">条件に合うお店が見つかりませんでした。<br>絞り込みを変えてみてください。</div>');
}
function refreshList(reset){ if(reset){renderLimit=RENDER_STEP;listEl.scrollTop=0;} renderList(); }
listEl.addEventListener('scroll',()=>{
  if(listEl.scrollTop+listEl.clientHeight>listEl.scrollHeight-200 && renderLimit<view.length){
    renderLimit+=RENDER_STEP; renderList();
  }
});
// 地図の表示範囲のみリストに出す
const areaToggle=document.getElementById('areaToggle');
areaToggle.onclick=()=>{
  boundsOnly=!boundsOnly;
  areaToggle.classList.toggle('on',boundsOnly);
  areaToggle.setAttribute('aria-pressed',boundsOnly);
  document.getElementById('rangeBox').classList.toggle('on',boundsOnly);
  refreshList(true);
  writeURL();
};
map.on('moveend',()=>{
  const by=document.getElementById('sort').value;
  if(by==='center') sortList();            // 中央が動いたら距離順を取り直す
  if(boundsOnly || by==='center') refreshList(true);
  writeURL();                              // 地図位置もURLに反映
});
listEl.addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(!c)return;
  const d=DATA[+c.dataset.id]; focusStore(d);
});
function focusStore(d){
  if(boundsOnly){
    // 「この範囲」表示中は地図を動かさず、その場でポップアップだけ開く
    // autoPan:false にしないと端の店で地図がパンして範囲が変わってしまう
    L.popup({maxWidth:240,minWidth:230,autoPan:false}).setLatLng([d.lat,d.lng]).setContent(popupHtml(d)).openOn(map);
  }else{
    map.setView([d.lat,d.lng],17,{animate:true});
    const m=markerById.get(d._id);
    if(m){ cluster.zoomToShowLayer(m,()=>m.openPopup()); }
  }
  if(window.innerWidth<640) sheet.classList.add('collapsed'),sheet.classList.remove('expanded');
}

// ---------- filtering ----------
function applyFilters(){
  const q=F.q.trim();
  filtered=DATA.filter(d=>{
    if(F.genre.size && !F.genre.has(d._bucket))return false;
    if(F.days.size && d.openDays){ for(const day of F.days){ if(!d.openDays[day])return false; } }
    if(F.station && d.station!==F.station)return false;
    if(F.bmin!=null || F.bmax!=null){
      if(d.budgetMin==null && d.budgetMax==null)return false;        // 予算不明は除外
      if(F.bmin!=null && d.budgetMax!=null && d.budgetMax<F.bmin)return false;
      if(F.bmax!=null && d.budgetMin!=null && d.budgetMin>F.bmax)return false;
    }
    if(F.rating && (d.rating||0)<F.rating)return false;
    for(const t of F.toggles){
      if(t==='award' && !(d.hyakumeiten||d.tabelogAward))return false;
      if(t==='privateRoom' && !d.privateRoom)return false;
      if(t==='reservation' && !/予約可|完全予約/.test(d.reservation))return false;
      if(t==='nosmoke' && !/全席禁煙/.test(d.smoking))return false;
    }
    if(q && !(d.name.includes(q)||d.genre.includes(q)||d.station.includes(q)))return false;
    return true;
  });
  sortList();
  // markers
  cluster.clearLayers();
  const ms=[];
  for(const d of filtered){ const m=markerById.get(d._id); if(m)ms.push(m); }
  cluster.addLayers(ms);
  // filter badge
  const fc=document.getElementById('fcount');
  const active=F.genre.size+F.days.size+(F.station?1:0)+((F.bmin!=null||F.bmax!=null)?1:0)+(F.rating?1:0)+F.toggles.size;
  fc.hidden=!active; fc.textContent=active;
  refreshList(true);
  writeURL();
}
function sortList(){
  const by=document.getElementById('sort').value;
  let cc=null;
  if(by==='center'){ const c=visibleBounds().getCenter(); cc=[c.lat,c.lng]; }
  filtered.sort((a,b)=>{
    if(by==='center'){
      return haversine(cc[0],cc[1],a.lat,a.lng)-haversine(cc[0],cc[1],b.lat,b.lng);
    }
    if(by==='dist'&&userLatLng){
      return haversine(userLatLng[0],userLatLng[1],a.lat,a.lng)-haversine(userLatLng[0],userLatLng[1],b.lat,b.lng);
    }
    if(by==='reviews')return b.reviews-a.reviews;
    if(by==='saves')return b.saves-a.saves;
    return (b.rating||0)-(a.rating||0)||b.reviews-a.reviews;
  });
}
document.getElementById('sort').addEventListener('change',()=>{sortList();refreshList(true);writeURL();});

// ---------- search ----------
let qt; document.getElementById('q').addEventListener('input',e=>{
  clearTimeout(qt); qt=setTimeout(()=>{F.q=e.target.value;applyFilters();},220);
});

// ---------- filter modal UI ----------
const filterModal=document.getElementById('filter');
document.getElementById('openFilter').onclick=()=>filterModal.classList.add('show');
filterModal.addEventListener('click',e=>{if(e.target.dataset.close!==undefined||e.target===e.currentTarget.querySelector('.scrim'))filterModal.classList.remove('show');});
filterModal.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{applyFilters();filterModal.classList.remove('show');});

function chip(label,on,onclick){
  const b=document.createElement('button');b.className='chip'+(on?' on':'');b.textContent=label;b.onclick=onclick;return b;
}
function buildFilterUI(){
  // genre buckets present in data, by frequency
  const cnt={}; DATA.forEach(d=>cnt[d._bucket]=(cnt[d._bucket]||0)+1);
  const order=[...GENRE_BUCKETS.map(g=>g[0]),'その他'].filter(g=>cnt[g]);
  const gc=document.getElementById('genreChips');
  order.forEach(g=>{
    const b=chip(`${g}`,F.genre.has(g),()=>{F.genre.has(g)?F.genre.delete(g):F.genre.add(g);b.classList.toggle('on');});
    gc.appendChild(b);
  });
  // stations
  const ss=document.getElementById('stationSel');
  const stc={}; DATA.forEach(d=>stc[d.station]=(stc[d.station]||0)+1);
  Object.keys(stc).sort((a,b)=>stc[b]-stc[a]).forEach(s=>{
    const o=document.createElement('option');o.value=s;o.textContent=`${s}（${stc[s]}）`;ss.appendChild(o);
  });
  ss.value=F.station;
  ss.onchange=e=>F.station=e.target.value;
  // 営業曜日（複数選択＝選んだ曜日すべてに営業している店）
  const dc=document.getElementById('dayChips');
  DAYNAMES.forEach((nm,i)=>{
    const b=chip(nm,F.days.has(i),()=>{F.days.has(i)?F.days.delete(i):F.days.add(i);b.classList.toggle('on');});
    dc.appendChild(b);
  });
  // ディナー予算（下限〜上限）
  const yen=v=>'¥'+v.toLocaleString();
  const minSel=document.getElementById('budgetMinSel'),maxSel=document.getElementById('budgetMaxSel');
  minSel.appendChild(new Option('下限なし',''));
  BUDGET_STEPS.forEach(v=>minSel.appendChild(new Option(yen(v)+'〜',v)));
  maxSel.appendChild(new Option('上限なし',''));
  BUDGET_STEPS.forEach(v=>maxSel.appendChild(new Option('〜'+yen(v),v)));
  minSel.value=F.bmin!=null?F.bmin:'';
  maxSel.value=F.bmax!=null?F.bmax:'';
  minSel.onchange=e=>{F.bmin=e.target.value?+e.target.value:null;};
  maxSel.onchange=e=>{F.bmax=e.target.value?+e.target.value:null;};
  // rating
  const rc=document.getElementById('ratingChips');
  RATINGS.forEach(([l,v])=>{const b=chip(l,v===F.rating,()=>{F.rating=v;rc.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');});rc.appendChild(b);});
  // toggles
  const tc=document.getElementById('toggleChips');
  TOGGLES.forEach(([k,l])=>{const b=chip(l,F.toggles.has(k),()=>{F.toggles.has(k)?F.toggles.delete(k):F.toggles.add(k);b.classList.toggle('on');});tc.appendChild(b);});
}
// ---------- URL共有（条件＋地図位置をURLに保存／復元） ----------
let urlReady=false;  // 初期化完了までURL書き込みを抑止
function writeURL(){
  if(!urlReady)return;
  const u=new URLSearchParams();
  if(F.genre.size) u.set('g',[...F.genre].map(n=>BUCKET_NAMES.indexOf(n)).join(','));
  if(F.days.size) u.set('d',[...F.days].sort((a,b)=>a-b).join(','));
  if(F.station) u.set('st',F.station);
  if(F.bmin!=null) u.set('bmin',F.bmin);
  if(F.bmax!=null) u.set('bmax',F.bmax);
  if(F.rating) u.set('r',F.rating);
  if(F.toggles.size) u.set('t',[...F.toggles].join(','));
  if(F.q&&F.q.trim()) u.set('q',F.q.trim());
  const s=document.getElementById('sort').value; if(s!=='center') u.set('s',s);
  if(!boundsOnly) u.set('a','0');
  const c=map.getCenter(); u.set('ll',c.lat.toFixed(5)+','+c.lng.toFixed(5)); u.set('z',map.getZoom());
  history.replaceState(null,'','?'+u.toString());
}
let pendingView=null;
function readURL(){
  const u=new URLSearchParams(location.search);
  if(u.has('g')) u.get('g').split(',').forEach(i=>{const n=BUCKET_NAMES[+i]; if(n)F.genre.add(n);});
  if(u.has('d')) u.get('d').split(',').forEach(i=>{const v=+i; if(v>=0&&v<=6)F.days.add(v);});
  if(u.has('st')) F.station=u.get('st');
  if(u.has('bmin')) F.bmin=+u.get('bmin')||null;
  if(u.has('bmax')) F.bmax=+u.get('bmax')||null;
  if(u.has('r')) F.rating=+u.get('r')||0;
  if(u.has('t')) u.get('t').split(',').forEach(k=>{if(k)F.toggles.add(k);});
  if(u.has('q')){ F.q=u.get('q'); document.getElementById('q').value=F.q; }
  if(u.has('s')) document.getElementById('sort').value=u.get('s');
  if(u.has('a')) boundsOnly=u.get('a')!=='0';
  if(u.has('ll')&&u.has('z')){
    const [la,ln]=u.get('ll').split(',').map(Number), z=+u.get('z');
    if(isFinite(la)&&isFinite(ln)&&isFinite(z)) pendingView=[[la,ln],z];
  }
  const at=document.getElementById('areaToggle');
  at.classList.toggle('on',boundsOnly); at.setAttribute('aria-pressed',boundsOnly);
  document.getElementById('rangeBox').classList.toggle('on',boundsOnly);
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800);
}
async function shareCurrent(){
  writeURL();
  const url=location.href;
  try{ if(navigator.share){ await navigator.share({title:'初台グルメマップ',text:'初台・渋谷・新宿のグルメマップ',url}); return; } }
  catch(e){ if(e&&e.name==='AbortError')return; }
  try{ await navigator.clipboard.writeText(url); toast('URLをコピーしました'); }
  catch(e){ window.prompt('このURLをコピーして共有してください', url); }
}
document.getElementById('shareBtn').onclick=shareCurrent;
document.getElementById('resetF').onclick=()=>{
  F.genre.clear();F.days.clear();F.station='';F.bmin=null;F.bmax=null;F.rating=0;F.toggles.clear();
  document.querySelectorAll('#filter .chip').forEach(c=>c.classList.remove('on'));
  document.querySelectorAll('#ratingChips .chip')[0].classList.add('on');
  document.getElementById('stationSel').value='';
  document.getElementById('budgetMinSel').value='';
  document.getElementById('budgetMaxSel').value='';
};

// ---------- bottom sheet drag ----------
const sheet=document.getElementById('sheet'),grip=document.getElementById('grip');
let dragY=null,startH=0;
function setH(px){sheet.style.height=Math.max(96,Math.min(window.innerHeight*0.92,px))+'px';}
grip.addEventListener('pointerdown',e=>{dragY=e.clientY;startH=sheet.offsetHeight;sheet.style.transition='none';grip.setPointerCapture(e.pointerId);});
grip.addEventListener('pointermove',e=>{if(dragY==null)return;setH(startH+(dragY-e.clientY));});
grip.addEventListener('pointerup',e=>{
  if(dragY==null)return;
  sheet.style.transition='';const h=sheet.offsetHeight;sheet.style.height='';
  sheet.classList.remove('expanded','collapsed');
  if(h>window.innerHeight*0.62)sheet.classList.add('expanded');
  else if(h<window.innerHeight*0.22)sheet.classList.add('collapsed');
  dragY=null;
});
grip.addEventListener('click',()=>{ // tap toggles
  if(sheet.classList.contains('expanded'))sheet.classList.remove('expanded');
  else sheet.classList.add('expanded'),sheet.classList.remove('collapsed');
});

// ---------- geolocation ----------
let userMarker=null;
document.getElementById('locBtn').onclick=()=>{
  if(!navigator.geolocation){alert('お使いの端末では現在地を取得できません');return;}
  const btn=document.getElementById('locBtn');btn.classList.add('active');
  navigator.geolocation.getCurrentPosition(p=>{
    userLatLng=[p.coords.latitude,p.coords.longitude];
    if(userMarker)userMarker.setLatLng(userLatLng);
    else userMarker=L.circleMarker(userLatLng,{radius:8,color:'#fff',weight:3,fillColor:'#3a78d6',fillOpacity:1}).addTo(map);
    map.setView(userLatLng,15);
    document.getElementById('sort').value='dist';
    sortList();refreshList(true);writeURL();
  },err=>{
    btn.classList.remove('active');
    alert('現在地を取得できませんでした。位置情報の許可をご確認ください。');
  },{enableHighAccuracy:true,timeout:8000});
};

// ---------- init ----------
// ?v= はデータ更新時のキャッシュ回避用。openDays等の項目追加時はバージョンを上げる
fetch('data/restaurants.json?v=2',{cache:'no-cache'}).then(r=>r.json()).then(rows=>{
  DATA=rows;
  DATA.forEach((d,i)=>{d._id=i;d._bucket=bucketOf(d.genre);});
  // build markers once
  DATA.forEach(d=>{
    const m=L.marker([d.lat,d.lng],{icon:makeIcon(d.rating||0)});
    m.bindPopup(()=>popupHtml(d),{maxWidth:240,minWidth:230});
    markerById.set(d._id,m);
  });
  readURL();                                   // URLから条件・地図位置を復元
  if(pendingView) map.setView(pendingView[0],pendingView[1]);
  buildFilterUI();                             // 復元したFをUIに反映
  urlReady=true;                               // 以降のwriteURLを許可
  applyFilters();
}).catch(e=>{
  listEl.innerHTML='<div class="empty">データの読み込みに失敗しました。<br>'+esc(e.message)+'</div>';
});
</script>
